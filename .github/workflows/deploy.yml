name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply zuens-dl-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build with OpenNext
        run: npx opennextjs-cloudflare build
      - name: Deploy Worker
        # OPEN_NEXT_DEPLOY 避免 OpenNext 再包一层 wrangler，把 wrangler.jsonc
        # 里的 CLOUDFLARE_API_TOKEN=NULL 注入进程、盖掉 GitHub Secret。
        run: npx wrangler deploy
        env:
          OPEN_NEXT_DEPLOY: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
